[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael Strömberg"]
repository = "https://github.com/MichaelStromberg/electropaint"
homepage = "https://github.com/MichaelStromberg/electropaint"
# Each crate opts in; ep-saver (a .saver bundle) stays out.
publish = false

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
as_ptr_cast_mut = "warn"
needless_pass_by_value = "warn"
allow_attributes_without_reason = "warn"
missing_panics_doc = "warn"
or_fun_call = "warn"
borrow_as_ptr = "warn"
trivially_copy_pass_by_ref = "warn"
unused_self = "warn"
# Contradicts unreachable_pub inside private modules.
redundant_pub_crate = "allow"

[profile.release]
debug = 1
