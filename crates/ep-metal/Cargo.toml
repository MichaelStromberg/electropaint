[package]
name = "electropaint-metal"
description = "Metal renderers for electropaint: classic, as an SGI RGB visual drew it, and remastered, as HDR iridescent chrome"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["sgi", "irix", "metal", "hdr", "demo"]
categories = ["rendering", "graphics", "os::macos-apis"]
publish = true

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]

[dependencies]
electropaint-core = { path = "../ep-core", version = "0.1.1" }
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGColorSpace", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSString", "objc2-core-foundation", "std"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDepthStencil", "MTLDevice", "MTLDrawable", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLTexture", "MTLTypes", "std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal", "std"] }

[lints]
workspace = true
