[package]
name = "ep-saver"
description = "electropaint as a macOS screen saver (.saver bundle)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ep-core = { path = "../ep-core" }
ep-metal = { path = "../ep-metal" }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDistributedNotificationCenter", "NSNotification", "NSRunLoop", "std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-core-foundation", "objc2-quartz-core", "std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CADisplayLink", "std"] }
objc2-screen-saver = { version = "0.3.2", default-features = false, features = ["ScreenSaverView", "objc2-app-kit", "std"] }

[features]
# The second saver, electropaint Remastered (scripts/make-saver.sh builds both).
remastered = []

[lints]
workspace = true
